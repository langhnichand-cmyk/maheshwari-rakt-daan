name: Deploy Live Web App

on:
  push:
    paths:
      - 'Maheshwari_Rakt_Daan_V34_PROFESSIONAL_LIVE.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V34 live web app
        run: |
          rm -rf site android-project
          mkdir -p site android-project
          unzip -q Maheshwari_Rakt_Daan_V34_PROFESSIONAL_LIVE.zip -d android-project
          cp -R android-project/app/src/main/assets/web/. site/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
